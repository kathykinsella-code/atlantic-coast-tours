<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlantic Coast Tours – Ask Us Anything</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ea; --surface: #ffffff; --ink: #1d2a33; --muted: #5d6b74;
    --sea: #0e5a6b; --sea-2: #127a8f; --foam: #e3f0f2; --sand: #e9dfcb;
    --line: #dcd6c8; --warn: #a14b1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f171c; --surface:#17232a; --ink:#e6eef1; --muted:#9aaab2;
      --sea:#4fb3c5; --sea-2:#6cc6d6; --foam:#1d3138; --sand:#2a2a22; --line:#2a3a42; --warn:#e39566; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 Inter, system-ui, sans-serif; }
  header { background:linear-gradient(160deg, #0b4553, #127a8f); color:#fff; padding:28px 16px 64px; }
  .wrap { max-width:1100px; margin:0 auto; }
  header h1 { font-family:Fraunces, Georgia, serif; font-size:clamp(1.7rem,4vw,2.5rem); margin:0 0 6px; }
  header p { margin:0; opacity:.9; max-width:60ch; }
  main { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:20px; margin-top:-40px; padding:0 16px 40px; }
  @media (max-width:860px){ main { grid-template-columns:1fr; } }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:0 6px 24px rgba(0,0,0,.07); }
  /* Chat */
  .chat { display:flex; flex-direction:column; height:min(78vh,720px); }
  .chat-head { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#2bb673; box-shadow:0 0 0 3px rgba(43,182,115,.2); }
  .chat-head strong { font-weight:600; }
  .chat-head span { color:var(--muted); font-size:.85rem; }
  #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .bot { background:var(--foam); align-self:flex-start; border-bottom-left-radius:4px; }
  .user { background:var(--sea); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  .err { background:transparent; color:var(--warn); border:1px solid var(--warn); }
  .typing { color:var(--muted); font-style:italic; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; padding:0 18px 10px; }
  .chip { border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:6px 12px; font:inherit; font-size:.85rem; cursor:pointer; }
  .chip:hover { border-color:var(--sea); color:var(--sea); }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  input { flex:1; min-width:0; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; }
  input:focus { outline:2px solid var(--sea-2); outline-offset:1px; }
  button.send { background:var(--sea); color:#fff; border:0; border-radius:12px; padding:0 18px; font:inherit; font-weight:600; cursor:pointer; }
  button.send:disabled { opacity:.5; cursor:default; }
  /* Tours */
  .tours { padding:16px; height:min(78vh,720px); display:flex; flex-direction:column; }
  .tours h2 { font-family:Fraunces, Georgia, serif; font-size:1.25rem; margin:2px 4px 10px; }
  .filters { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .filters input, .filters select { padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; font-size:.9rem; }
  .filters input { flex:1; min-width:140px; }
  #tourList { overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-right:2px; }
  .tour { border:1px solid var(--line); border-radius:12px; padding:12px 14px; cursor:pointer; background:var(--surface); }
  .tour:hover { border-color:var(--sea); }
  .tour-top { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .tour h3 { font-size:1rem; margin:0; }
  .price { font-weight:600; color:var(--sea); white-space:nowrap; }
  .meta { color:var(--muted); font-size:.85rem; margin-top:2px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .tag { font-size:.75rem; padding:2px 8px; border-radius:999px; background:var(--sand); }
  .tag.full { background:transparent; border:1px solid var(--warn); color:var(--warn); }
  .tag.offer { background:var(--foam); color:var(--sea); }
  .note { color:var(--muted); font-size:.8rem; margin:8px 4px 0; }
  footer { text-align:center; color:var(--muted); font-size:.8rem; padding:0 16px 30px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Atlantic Coast Tours</h1>
    <p>Ask our assistant about prices, availability, meeting points, offers and anything else about our tours on the Wild Atlantic Way.</p>
  </div>
</header>

<main class="wrap">
  <section class="card chat" aria-label="Chat with our assistant">
    <div class="chat-head"><div class="dot"></div><div><strong>Tour Assistant</strong><br><span>Live tour info, straight from our schedule</span></div></div>
    <div id="log" aria-live="polite"></div>
    <div class="chips" id="chips">
      <button class="chip">Which tours have spots this week?</button>
      <button class="chip">What's on special offer?</button>
      <button class="chip">Cheapest tours under €50</button>
      <button class="chip">Family-friendly options in Mayo?</button>
    </div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Ask about a tour, price or availability…" maxlength="1000" aria-label="Your question">
      <button class="send" id="send" type="submit">Send</button>
    </form>
  </section>

  <aside class="card tours" aria-label="Our tours">
    <h2>Our tours</h2>
    <div class="filters">
      <input id="q" placeholder="Search tours or places…" aria-label="Search tours">
      <select id="cat" aria-label="Category"><option value="">All categories</option></select>
    </div>
    <div id="tourList"><p class="note">Loading tours…</p></div>
    <p class="note" id="updated"></p>
  </aside>
</main>
<footer>Tour details update live from our booking sheet.</footer>

<script src="config.js"></script>
<script>
const API = window.CHATBOT_API_URL;
const configured = API && !API.startsWith('PASTE_');
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const history = [];
let tours = [];

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

addMsg("Hi! 👋 I can help you find the right tour: prices, free slots this week, meeting points and current offers. What are you looking for?", 'bot');

async function ask(text) {
  text = text.trim();
  if (!text) return;
  addMsg(text, 'user');
  input.value = '';
  sendBtn.disabled = true;
  const typing = addMsg('Checking our schedule…', 'bot typing');
  try {
    if (!configured) throw new Error('The chatbot backend has not been connected yet.');
    // text/plain avoids a CORS preflight, which Apps Script doesn't support.
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ message: text, history }) });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    typing.className = 'msg bot';
    typing.textContent = data.reply;
    history.push({ role: 'user', text }, { role: 'assistant', text: data.reply });
  } catch (e) {
    typing.className = 'msg bot err';
    typing.textContent = e.message || 'Sorry, I could not reach the assistant. Please try again.';
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', e => { e.preventDefault(); ask(input.value); });
document.getElementById('chips').addEventListener('click', e => {
  if (e.target.classList.contains('chip')) ask(e.target.textContent);
});

// ---- Live tour list ----
const listEl = document.getElementById('tourList');
const qEl = document.getElementById('q');
const catEl = document.getElementById('cat');

function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

function renderTours() {
  const q = qEl.value.toLowerCase();
  const cat = catEl.value;
  const shown = tours.filter(t =>
    (!cat || t.category === cat) &&
    (!q || [t.tour_name, t.location, t.description, t.category].join(' ').toLowerCase().includes(q)));
  listEl.replaceChildren();
  if (!shown.length) { listEl.appendChild(el('p', 'note', 'No tours match.')); return; }
  for (const t of shown) {
    const card = el('div', 'tour');
    card.tabIndex = 0;
    const top = el('div', 'tour-top');
    top.append(el('h3', null, t.tour_name), el('span', 'price', '€' + Number(t.price_eur).toLocaleString('en-IE')));
    card.append(top, el('div', 'meta', `${t.location} · ${t.duration_hours}h · ${t.availability}`));
    const tags = el('div', 'tags');
    tags.append(el('span', 'tag', t.category));
    const slots = Number(t.slots_this_week);
    tags.append(slots > 0 ? el('span', 'tag', `${slots} spots this week`) : el('span', 'tag full', 'Full this week'));
    if (t.special_offer) tags.append(el('span', 'tag offer', t.special_offer));
    card.append(tags);
    const askAbout = () => ask(`Tell me more about the ${t.tour_name}`);
    card.addEventListener('click', askAbout);
    card.addEventListener('keydown', e => { if (e.key === 'Enter') askAbout(); });
    listEl.appendChild(card);
  }
}

async function loadTours() {
  if (!configured) { listEl.replaceChildren(el('p', 'note', 'Tour list will appear once the backend is connected.')); return; }
  try {
    const res = await fetch(API + '?action=tours');
    const data = await res.json();
    tours = data.tours || [];
    const cats = [...new Set(tours.map(t => t.category).filter(Boolean))].sort();
    const current = catEl.value;
    catEl.replaceChildren(new Option('All categories', ''), ...cats.map(c => new Option(c, c)));
    catEl.value = current;
    renderTours();
    document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-IE', { hour: '2-digit', minute: '2-digit' });
  } catch {
    listEl.replaceChildren(el('p', 'note', 'Could not load tours right now.'));
  }
}
qEl.addEventListener('input', renderTours);
catEl.addEventListener('change', renderTours);
loadTours();
setInterval(loadTours, 60000); // refresh the list every minute so sheet edits appear
</script>
</body>
</html>
