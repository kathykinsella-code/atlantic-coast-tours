<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask Atlantic · Atlantic Coast Tours</title>
<style>
  :root {
    --navy: #0b2a3f;
    --navy-2: #12405e;
    --foam: #3fb6a8;
    --foam-soft: #e3f4f1;
    --sand: #f6efe2;
    --ink: #17252f;
    --muted: #6b7c87;
    --bg: #eef3f5;
    --bot-bubble: #ffffff;
    --user-bubble: #f6e7c8;
    --error-bg: #fdecea;
    --error-ink: #9b2c1f;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }
  header {
    background:
      linear-gradient(180deg, rgba(11, 42, 63, .35) 0%, rgba(11, 42, 63, .85) 100%),
      url("img/Cliffs%20of%20moher.jpg") center 35% / cover no-repeat,
      linear-gradient(135deg, var(--navy), var(--navy-2)); /* fallback if the photo is missing */
    color: #fff;
    padding: 44px 16px 22px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .45);
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }
  header::after { /* subtle wave */
    content: "";
    position: absolute; left: 0; right: 0; bottom: -1px; height: 10px;
    background: radial-gradient(circle at 10px -4px, transparent 12px, var(--bg) 13px) repeat-x;
    background-size: 20px 10px;
  }
  .logo {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--foam);
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .logo svg { width: 24px; height: 24px; }
  header h1 { font-size: 1.1rem; margin: 0; letter-spacing: .2px; }
  header p { font-size: .8rem; margin: 2px 0 0; opacity: .8; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { display: flex; flex-direction: column; max-width: 85%; }
  .msg.bot { align-self: flex-start; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .bubble {
    padding: 11px 14px;
    border-radius: var(--radius);
    line-height: 1.45;
    font-size: .95rem;
    white-space: pre-wrap;
    word-wrap: break-word;
    box-shadow: 0 1px 2px rgba(11, 42, 63, .08);
  }
  .bot .bubble { background: var(--bot-bubble); border-bottom-left-radius: 6px; border-left: 3px solid var(--foam); }
  .user .bubble { background: var(--user-bubble); border-bottom-right-radius: 6px; }
  .error .bubble { background: var(--error-bg); color: var(--error-ink); border-left-color: var(--error-ink); }
  .meta { font-size: .72rem; color: var(--muted); margin: 4px 6px 0; }

  /* Photo cards in the welcome message */
  .msg.welcome { max-width: 100%; align-self: stretch; min-width: 0; }
  .msg.welcome .bubble { max-width: 85%; }
  .gallery {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding: 10px 2px 6px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;            /* hide scrollbar (Firefox) – still swipeable */
  }
  .gallery::-webkit-scrollbar { display: none; } /* hide scrollbar (Chrome/Edge/Safari) */
  @media (min-width: 560px) {
    .gallery { overflow: visible; }
    .place { flex: 1 1 0; min-width: 0; max-width: none; } /* all three cards fit side by side */
  }
  .place {
    position: relative;
    flex: 0 0 70%;
    max-width: 230px;
    aspect-ratio: 4 / 3;
    border: 0;
    padding: 0;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    scroll-snap-align: start;
    background: var(--navy);
    box-shadow: 0 2px 8px rgba(11, 42, 63, .15);
  }
  .place img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s ease; }
  .place:hover img, .place:focus-visible img { transform: scale(1.05); }
  .place span {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 22px 10px 8px;
    background: linear-gradient(transparent, rgba(11, 42, 63, .9));
    color: #fff; font-size: .8rem; font-weight: 600; text-align: left; line-height: 1.25;
  }
  .place small { display: block; font-weight: 400; opacity: .85; }
  .place:disabled { cursor: default; opacity: .7; }

  .thinking .bubble { color: var(--muted); font-style: italic; }
  .dots span {
    display: inline-block; width: 5px; height: 5px; margin-left: 3px;
    border-radius: 50%; background: var(--foam);
    animation: bob 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: .15s; }
  .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-4px); opacity: 1; } }

  .suggestions { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 16px 8px; }
  .suggestions button {
    border: 1px solid var(--foam);
    background: var(--foam-soft);
    color: var(--navy);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: .8rem;
    cursor: pointer;
  }

  form {
    display: flex;
    gap: 8px;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    background: #fff;
    border-top: 1px solid #dde6ea;
  }
  input {
    flex: 1;
    min-width: 0;
    font-size: 1rem; /* 16px avoids iOS zoom */
    padding: 12px 14px;
    border: 1px solid #cfdbe1;
    border-radius: 999px;
    outline: none;
    background: var(--sand);
  }
  input:focus { border-color: var(--foam); box-shadow: 0 0 0 3px rgba(63, 182, 168, .2); }
  button[type="submit"] {
    border: 0;
    border-radius: 999px;
    padding: 0 20px;
    font-size: .95rem;
    font-weight: 600;
    background: var(--navy);
    color: #fff;
    cursor: pointer;
  }
  button[type="submit"]:disabled { opacity: .5; cursor: default; }

  @media (min-width: 720px) {
    .app { height: calc(100dvh - 32px); margin: 16px 0; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(11, 42, 63, .12); }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
        <path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/>
        <path d="M2 19c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/>
        <path d="M12 3v7M8 7l4-4 4 4"/>
      </svg>
    </div>
    <div>
      <h1>Ask Atlantic</h1>
      <p>Atlantic Coast Tours · live tour info</p>
    </div>
  </header>

  <main id="chat" aria-live="polite"></main>

  <div class="suggestions" id="suggestions">
    <button type="button">Which tours have slots this week?</button>
    <button type="button">What's the cheapest tour?</button>
    <button type="button">Any special offers?</button>
  </div>

  <form id="form" autocomplete="off">
    <input id="input" type="text" placeholder="Ask about tours, prices, slots…" aria-label="Your question" required>
    <button type="submit" id="send">Send</button>
  </form>
</div>

<script>
  const CSV_URL = "https://docs.google.com/spreadsheets/d/1balBGf8QhZ5dc-RCCAPt2kcrcf6m_YRh0HL_r8bBtJw/export?format=csv";
  const BRAIN_URL = "https://luas-class.kluxy.app/chat";
  const SYSTEM = "You are Ask Atlantic, the customer assistant for Atlantic Coast Tours. Answer only from the live data you are given. Quote exact prices in euro and slots left. If something is not in the data, say so. If a value looks implausible, say so and suggest the customer checks with staff. Be warm and brief.";

  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const suggestions = document.getElementById("suggestions");

  function addMessage(text, who, opts = {}) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + who + (opts.error ? " error" : "") + (opts.thinking ? " thinking" : "");
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (opts.thinking) {
      bubble.innerHTML = 'Thinking<span class="dots"><span></span><span></span><span></span></span>';
    } else {
      bubble.textContent = text; // textContent: never inject HTML from data or replies
    }
    wrap.appendChild(bubble);
    if (opts.meta) {
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = opts.meta;
      wrap.appendChild(meta);
    }
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return wrap;
  }

  function timeNow() {
    const d = new Date();
    return [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, "0")).join(":");
  }

  async function fetchCsv() {
    // Cache-buster + no-store so every question sees the latest sheet edits
    let res;
    try {
      res = await fetch(CSV_URL + "&t=" + Date.now(), { cache: "no-store" });
    } catch (e) {
      if (location.protocol === "file:") {
        throw new Error("Couldn't load the tour catalogue because this page was opened as a file (file://). Google blocks that. Open it from a web address instead, e.g. GitHub Pages or a local server like http://localhost:8000.");
      }
      throw new Error("Couldn't reach the tour catalogue (Google Sheets): " + e.message + ". Check your internet connection, or try turning off ad/privacy blockers.");
    }
    if (!res.ok) throw new Error("Couldn't load the tour catalogue (HTTP " + res.status + "). Is the sheet shared as 'Anyone with the link'?");
    const csv = await res.text();
    if (/^\s*<!DOCTYPE html/i.test(csv)) throw new Error("The sheet returned a web page instead of CSV. Check it is shared as 'Anyone with the link can view'.");
    return { csv, fetchedAt: timeNow() };
  }

  async function askBrain(question, csv) {
    let res;
    try {
      res = await fetch(BRAIN_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system: SYSTEM,
          messages: [{ role: "user", content: "Live data (CSV):\n" + csv + "\n\nCustomer question: " + question }]
        })
      });
    } catch (e) {
      throw new Error("Got the tour data, but couldn't reach the class assistant (luas-class.kluxy.app): " + e.message + ". It may be briefly down, or blocked by an ad/privacy blocker or this network. Please try again.");
    }
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); } catch { throw new Error("The assistant sent an unexpected response (HTTP " + res.status + "): " + raw.slice(0, 200)); }
    if (!res.ok) throw new Error("The assistant returned an error (HTTP " + res.status + "): " + (data.error || data.message || raw.slice(0, 200)));
    if (typeof data.reply !== "string") throw new Error("The assistant's response had no \"reply\" field.");
    return data.reply;
  }

  async function handleQuestion(question) {
    question = question.trim();
    if (!question) return;
    suggestions.style.display = "none";
    addMessage(question, "user");
    input.value = "";
    input.disabled = true;
    send.disabled = true;
    const thinking = addMessage("", "bot", { thinking: true });

    try {
      const { csv, fetchedAt } = await fetchCsv();
      const reply = await askBrain(question, csv);
      thinking.remove();
      addMessage(reply, "bot", { meta: "Data fetched live at " + fetchedAt });
    } catch (err) {
      thinking.remove();
      addMessage("Sorry, something went wrong. " + err.message, "bot", { error: true, meta: "Error at " + timeNow() });
    } finally {
      input.disabled = false;
      send.disabled = false;
      input.focus();
    }
  }

  // Submitting the form covers both the Send button and the Enter key
  form.addEventListener("submit", e => {
    e.preventDefault();
    handleQuestion(input.value);
  });

  suggestions.addEventListener("click", e => {
    if (e.target.tagName === "BUTTON") handleQuestion(e.target.textContent);
  });

  const welcome = addMessage("Hi! I'm Ask Atlantic 🌊 Ask me anything about our tours: prices, slots this week, meeting points or special offers. Or tap a place below.", "bot");
  welcome.classList.add("welcome");

  const PLACES = [
    { img: "img/Cliffs%20of%20moher.jpg",     name: "Cliffs of Moher",     where: "Co. Clare",        q: "Do you have any tours to the Cliffs of Moher?" },
    { img: "img/Dogs%20Beach.jpg",            name: "Dog's Bay",           where: "Connemara",        q: "What tours do you have in Connemara?" },
    { img: "img/fastnet-lighthouse.jpg",      name: "Fastnet Lighthouse",  where: "Co. Cork",         q: "Do you have any boat tours, and how many slots are left?" }
  ];
  const gallery = document.createElement("div");
  gallery.className = "gallery";
  PLACES.forEach(p => {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "place";
    const img = document.createElement("img");
    img.src = p.img;
    img.alt = p.name + ", " + p.where;
    img.loading = "lazy";
    img.onerror = () => card.remove(); // hide the card if the photo is missing
    const label = document.createElement("span");
    label.textContent = p.name;
    const small = document.createElement("small");
    small.textContent = p.where;
    label.appendChild(small);
    card.append(img, label);
    card.addEventListener("click", () => { if (!send.disabled) handleQuestion(p.q); });
    gallery.appendChild(card);
  });
  welcome.appendChild(gallery);
  input.focus();
</script>
</body>
</html>
